<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully prevent benign Vite HMR WebSocket connection errors in sandbox iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var reasonStr = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
        if (
          reasonStr.includes('WebSocket') ||
          reasonStr.includes('websocket') ||
          reasonStr.includes('failed to connect to websocket') ||
          reasonStr.includes('WebSocket closed without opened')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('[vite]') ||
          filename.includes('@vite')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPACED — Interplanetary Travel & Planet Exploration</title>
    <meta name="description" content="Pioneering interplanetary travel. Explore Mars, Europa, Titan, Kepler-186f, and book orbital expeditions." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#05070D] text-[#F5F5F5] selection:bg-[#FF5A1F] selection:text-white antialiased overflow-x-hidden font-['Space_Grotesk',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
